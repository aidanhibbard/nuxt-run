# Publish to npm on release tags (requires Trusted Publisher on npmjs.com).
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run prepack

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "nuxt-run@${VERSION}" version >/dev/null 2>&1; then
            echo "nuxt-run@${VERSION} already on npm, skipping publish"
            exit 0
          fi
          npm publish --access public --provenance
